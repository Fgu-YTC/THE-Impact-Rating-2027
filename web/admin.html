<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE Impact 2027 管理／分派</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=20261029b" />
</head>
<body>
  <div id="authGate" class="auth-gate">
    <h1>管理登入</h1>
    <p id="authHint">使用學校 Google 帳號登入後，可分派 SDG 題目給各單位。</p>
    <button type="button" id="btnGoogle">使用 Google 登入</button>
    <div id="authError" class="auth-error" hidden></div>
    <p style="margin-top:1.25rem;font-size:0.85rem"><a href="index.html">返回填報頁</a></p>
  </div>

  <div id="adminApp" class="mode-assign" hidden>
    <header class="topbar admin-topbar">
      <div class="admin-top-left">
        <div class="brand">THE Impact 管理</div>
        <div class="lang-toggle mode-toggle" id="modeToggle" aria-label="管理畫面">
          <button type="button" data-mode="assign" class="active">分派</button>
          <button type="button" data-mode="fill">填寫</button>
          <button type="button" data-mode="review">檢視</button>
        </div>
      </div>

      <div class="admin-progress" id="adminStats" title="填寫進度：已有內容的題數／已分派題數">
        <div class="admin-progress-main">
          <span class="admin-progress-label">填寫進度</span>
          <strong><span id="statFilled">0</span>／<span id="statFillDue">0</span></strong>
        </div>
        <div class="admin-progress-sub">
          分派 <strong id="statAssigned">0</strong>／<strong id="statTotal">0</strong>
          <span class="dot">·</span>
          未填 <strong id="statUnfilled">0</strong>
          <span class="dot">·</span>
          未派 <strong id="statUnassigned">0</strong>
        </div>
      </div>

      <div class="top-actions admin-top-actions">
        <div class="lang-toggle" id="langToggle" aria-label="語言">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <span class="user-chip" id="userChip"></span>
        <a class="admin-link" href="index.html">填報頁</a>
        <button type="button" id="btnLogout" class="secondary">登出</button>
      </div>
    </header>

    <div class="admin-chrome">
      <div
        id="dataYearNote"
        class="data-year-note admin-year-note"
        title="數字題以 113 學年為準；政策／措施須於該學年度結束前已生效。若該題方法論另有註明，以該題為準。"
      >資料年度：Impact 2027 · <strong>113 學年度</strong></div>

      <nav class="sdg-tabs admin-sdg-tabs" id="sdgTabs" aria-label="SDG1-17"></nav>

      <div class="admin-toolbar">
        <div class="filter-bar" id="filterBar">
          <button type="button" data-filter="all" class="active">全部</button>
          <button type="button" data-filter="unassigned" data-for="assign">未分配</button>
          <button type="button" data-filter="assigned" data-for="assign">已分配</button>
          <button type="button" data-filter="returned" data-for="assign">已退回</button>
          <button type="button" data-filter="filled" data-for="review">已填寫</button>
          <button type="button" data-filter="unfilled" data-for="review">未填寫</button>
          <button type="button" data-filter="returned" data-for="review">已退回</button>
          <button type="button" id="btnSelectUnassigned" class="secondary filter-action" data-for="assign">勾選本 SDG 未分配</button>
          <button type="button" id="btnReloadAnswers" class="secondary filter-action" data-for="review">重新讀取填答</button>
        </div>
        <div class="unit-filter" id="unitFilter" data-for="browse">
          <div class="unit-filter-head">
            <button type="button" id="btnToggleUnitFilter" class="secondary unit-filter-toggle" aria-expanded="false" aria-controls="unitFilterBody">
              篩選單位
            </button>
            <span id="unitFilterSummary" class="unit-filter-summary">未篩選</span>
            <button type="button" id="btnClearUnitFilter" class="secondary">清除</button>
          </div>
          <div class="unit-filter-body" id="unitFilterBody" hidden>
            <div id="unitFilterList"></div>
          </div>
        </div>
      </div>
    </div>

    <main class="layout with-bottom admin-layout">
      <section class="pane pane-left" aria-label="提問分派">
        <h2>提問</h2>
        <div id="questionList"></div>
      </section>
      <aside class="pane pane-right" aria-label="方法論">
        <h2 id="methodTitle">方法論</h2>
        <div class="method-body" id="methodBody"></div>
        <form id="methodAsk" class="method-ask" hidden>
          <button type="submit" id="methodAskBtn">問 Gemini</button>
          <p id="methodAskHint" class="method-ask-hint">非高階模型，使用時請耐心等候。</p>
          <div id="methodAskAnswer" class="method-ask-answer" hidden></div>
        </form>
      </aside>
    </main>

    <footer class="bottombar admin-bottombar">
      <div id="exportBanner" class="submit-banner" hidden role="status" aria-live="assertive"></div>

      <div class="admin-bottom-main" data-for="assign">
        <span class="admin-selected">已勾選 <strong id="selectedCount">0</strong></span>
        <label class="admin-unit-label" for="assignUnit">分派給</label>
        <select id="assignUnit"></select>
        <button type="button" id="btnAssign" disabled>送出分派</button>
        <button type="button" id="btnUnassign" class="secondary" disabled>取消此單位分派</button>
      </div>

      <div class="admin-bottom-main" data-for="review">
        <button type="button" id="btnExportForms" class="secondary" title="同一題若有多單位答案，匯出只會有一份；請先在填寫模式人工整理">匯出題目與填答</button>
        <button type="button" id="btnExportFiles" class="secondary">匯出證據壓縮檔</button>
      </div>

      <div class="admin-bottom-main" data-for="fill">
        <button type="button" id="btnAdminSubmit" class="fill-submit">儲存修改</button>
      </div>

      <details class="admin-more" data-for="assign">
        <summary>單位／分組管理</summary>
        <div class="admin-more-body admin-unit-manage">
          <button type="button" id="btnClearAssignments" class="secondary">清除全部分配</button>
          <div class="admin-manage-row">
            <span class="admin-manage-label">分組</span>
            <select id="manageGroupSelect" aria-label="現有分組"></select>
            <input type="text" id="newGroupName" placeholder="新分組名稱" />
            <button type="button" id="btnAddGroup" class="secondary">新增分組</button>
            <button type="button" id="btnRemoveGroup" class="secondary">刪除分組</button>
          </div>
          <div class="admin-manage-row">
            <span class="admin-manage-label">單位</span>
            <input type="text" id="newUnitName" placeholder="新增單位名稱" />
            <select id="newUnitGroup" aria-label="所屬分組"></select>
            <button type="button" id="btnAddUnit" class="secondary">新增單位</button>
            <button type="button" id="btnRemoveUnit" class="secondary" disabled>刪除單位</button>
          </div>
          <div class="admin-manage-row">
            <span class="admin-manage-label">改分組</span>
            <select id="editUnitGroup" aria-label="變更所屬分組"></select>
            <button type="button" id="btnSetUnitGroup" class="secondary" disabled>套用到選中單位</button>
          </div>
        </div>
      </details>
    </footer>
  </div>

  <script src="js/firebase-config.js?v=20261029b"></script>
  <script src="js/admin-allowlist.js?v=20261029b"></script>
  <script src="js/storage.js?v=20261029b"></script>
  <script src="js/live.js?v=20261029b"></script>
  <script src="js/ui.js?v=20261029b"></script>
  <script src="js/methodology.js?v=20261029b"></script>
  <script src="js/auth.js?v=20261029b"></script>
  <script src="js/export.js?v=20261029b"></script>
  <script src="js/submit.js?v=20261029b"></script>
  <script src="js/admin.js?v=20261029b"></script>
  <script src="js/ask.js?v=20261029b"></script>
</body>
</html>
