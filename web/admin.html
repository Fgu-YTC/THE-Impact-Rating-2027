<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE Impact 2027 管理／分派</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=20261028e" />
</head>
<body>
  <div id="authGate" class="auth-gate">
    <h1>管理登入</h1>
    <p id="authHint">使用學校 Google 帳號登入後，可分派 SDG 題目給各單位。</p>
    <button type="button" id="btnGoogle">使用 Google 登入</button>
    <div id="authError" class="auth-error" hidden></div>
    <p style="margin-top:1.25rem;font-size:0.85rem"><a href="index.html">返回填報頁</a></p>
  </div>

  <div id="adminApp" class="mode-assign" hidden>
    <header class="topbar">
      <div class="brand">THE Impact 管理</div>
      <div class="stats" id="adminStats" title="填寫進度：已有內容的題數／已分派題數">
        <span>全部 <strong id="statTotal">0</strong></span>
        <span>已分配 <strong id="statAssigned">0</strong></span>
        <span>未分配 <strong id="statUnassigned">0</strong></span>
        <span class="stat-progress">填寫進度 <strong id="statFilled">0</strong>／<strong id="statFillDue">0</strong></span>
        <span>未填 <strong id="statUnfilled">0</strong></span>
      </div>
      <div class="top-actions">
        <div class="lang-toggle" id="modeToggle" aria-label="管理畫面">
          <button type="button" data-mode="assign" class="active">分派</button>
          <button type="button" data-mode="fill">填寫</button>
          <button type="button" data-mode="review">檢視填答</button>
        </div>
        <div class="lang-toggle" id="langToggle" aria-label="語言">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <span class="user-chip" id="userChip"></span>
        <a href="index.html">填報頁</a>
        <button type="button" id="btnLogout" class="secondary">登出</button>
      </div>
    </header>
    <div id="dataYearNote" class="data-year-note">資料年度：Impact 2027 請蒐集 <strong>113 學年度</strong>資料。數字題以 113 學年為準；政策／措施須於該學年度結束前已生效。若該題方法論另有註明，以該題為準。</div>

    <nav class="sdg-tabs" id="sdgTabs" aria-label="SDG1-17"></nav>

    <div class="filter-bar" id="filterBar" style="padding:0.5rem 1.25rem;margin:0;border-bottom:1px solid var(--line);background:rgba(255,252,247,0.7)">
      <button type="button" data-filter="all" class="active">全部</button>
      <button type="button" data-filter="unassigned" data-for="assign">未分配</button>
      <button type="button" data-filter="assigned" data-for="assign">已分配</button>
      <button type="button" data-filter="returned" data-for="assign">已退回</button>
      <button type="button" data-filter="filled" data-for="review">已填寫</button>
      <button type="button" data-filter="unfilled" data-for="review">未填寫</button>
      <button type="button" data-filter="returned" data-for="review">已退回</button>
      <button type="button" id="btnSelectUnassigned" class="secondary" data-for="assign">勾選本 SDG 未分配題</button>
      <button type="button" id="btnReloadAnswers" class="secondary" data-for="review">重新讀取填答</button>
    </div>
    <div class="unit-filter" id="unitFilter" data-for="browse">
      <div class="unit-filter-head">
        <button type="button" id="btnToggleUnitFilter" class="secondary unit-filter-toggle" aria-expanded="false" aria-controls="unitFilterBody">
          篩選單位
        </button>
        <span id="unitFilterSummary" class="unit-filter-summary">未篩選（顯示全部）</span>
        <button type="button" id="btnClearUnitFilter" class="secondary">清除篩選</button>
      </div>
      <div class="unit-filter-body" id="unitFilterBody" hidden>
        <div id="unitFilterList"></div>
      </div>
    </div>

    <main class="layout with-bottom">
      <section class="pane pane-left" aria-label="提問分派">
        <h2>提問</h2>
        <div id="questionList"></div>
      </section>
      <aside class="pane pane-right" aria-label="方法論">
        <h2 id="methodTitle">方法論</h2>
        <div class="method-body" id="methodBody"></div>
        <form id="methodAsk" class="method-ask" hidden>
          <button type="submit" id="methodAskBtn">問 Gemini</button>
          <p id="methodAskHint" class="method-ask-hint">非高階模型，使用時請耐心等候。</p>
          <div id="methodAskAnswer" class="method-ask-answer" hidden></div>
        </form>
      </aside>
    </main>

    <footer class="bottombar">
      <div id="exportBanner" class="submit-banner" hidden role="status" aria-live="assertive"></div>
      <span data-for="assign">已勾選 <strong id="selectedCount">0</strong> 題</span>
      <label for="assignUnit" data-for="assign">單位</label>
      <select id="assignUnit" data-for="assign"></select>
      <button type="button" id="btnAssign" data-for="assign" disabled>送出分派</button>
      <button type="button" id="btnUnassign" class="secondary" data-for="assign" disabled>取消此單位分派</button>
      <button type="button" id="btnClearAssignments" class="secondary" data-for="assign">清除全部分配</button>
      <button type="button" id="btnExportForms" class="secondary" data-for="review" title="同一題若有多單位答案，匯出只會有一份；請先在填寫模式人工整理">匯出題目與填答</button>
      <button type="button" id="btnExportFiles" class="secondary" data-for="review">匯出證據壓縮檔</button>
      <button type="button" id="btnAdminSubmit" data-for="fill">儲存修改</button>
      <span data-for="assign" style="margin-left:auto;display:flex;gap:0.5rem;align-items:center">
        <input type="text" id="newUnitName" placeholder="新增單位名稱" />
        <button type="button" id="btnAddUnit" class="secondary">新增單位</button>
        <button type="button" id="btnRemoveUnit" class="secondary" disabled>刪除單位</button>
      </span>
    </footer>
  </div>

  <script src="js/firebase-config.js?v=20261028e"></script>
  <script src="js/admin-allowlist.js?v=20261028e"></script>
  <script src="js/storage.js?v=20261028e"></script>
  <script src="js/live.js?v=20261028e"></script>
  <script src="js/ui.js?v=20261028e"></script>
  <script src="js/methodology.js?v=20261028e"></script>
  <script src="js/auth.js?v=20261028e"></script>
  <script src="js/export.js?v=20261028e"></script>
  <script src="js/submit.js?v=20261028e"></script>
  <script src="js/admin.js?v=20261028e"></script>
  <script src="js/ask.js?v=20261028e"></script>
</body>
</html>
