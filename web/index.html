<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE Impact 2027 填報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=20261029a" />
</head>
<body>
  <header class="topbar">
    <div class="brand">THE Impact 2027</div>
    <label for="unitSelect">填寫單位</label>
    <select id="unitSelect">
      <option value="">選擇單位…</option>
    </select>
    <div class="top-actions">
      <div class="lang-toggle" id="langToggle" aria-label="語言">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" id="btnTour" class="secondary tour-reopen">重看提交教學</button>
      <a href="admin.html">管理</a>
    </div>
  </header>
  <div id="dataYearNote" class="data-year-note">資料年度：Impact 2027 請蒐集 <strong>113 學年度</strong>資料。數字題以 113 學年為準；政策／措施須於該學年度結束前已生效。若該題方法論另有註明，以該題為準。</div>
  <div id="submitBanner" class="submit-banner" hidden role="status" aria-live="assertive"></div>

  <nav class="sdg-tabs" id="sdgTabs" aria-label="SDG"></nav>

  <main class="layout with-bottom">
    <section class="pane pane-left" aria-label="提問">
      <h2>提問</h2>
      <div id="emptyState" class="empty"></div>
      <div id="questionList"></div>
    </section>
    <aside class="pane pane-right" aria-label="方法論">
      <h2 id="methodTitle">方法論</h2>
      <div class="method-body" id="methodBody"></div>
      <form id="methodAsk" class="method-ask" hidden>
        <button type="submit" id="methodAskBtn">問 Gemini</button>
        <p id="methodAskHint" class="method-ask-hint">非高階模型，使用時請耐心等候。</p>
        <div id="methodAskAnswer" class="method-ask-answer" hidden></div>
      </form>
    </aside>
  </main>

  <footer class="bottombar">
    <span id="submitHint">改完按右邊提交（會問填寫人）。提交後仍可修改，再提交即可更新。</span>
    <button type="button" id="btnSubmit" class="fill-submit">提交</button>
  </footer>

  <div id="fillerDialog" class="filler-dialog" hidden>
    <form id="fillerForm" class="filler-card">
      <h2 id="fillerTitle">這次是誰填的？</h2>
      <p id="fillerNote">送出後，這個單位和管理頁都會看到填寫人。僅作確認使用。</p>
      <input id="fillerName" name="fillerName" maxlength="40" required placeholder="填寫人姓名" autocomplete="name" />
      <div class="filler-actions">
        <button type="button" id="fillerCancel" class="secondary">取消</button>
        <button type="submit" id="fillerSend">送出</button>
      </div>
    </form>
  </div>

  <div id="tourRoot" class="tour-root" hidden>
    <div class="tour-spot" data-tour-spot aria-hidden="true"></div>
    <div class="tour-pop" data-tour-pop role="dialog" aria-modal="true" aria-labelledby="tourTitle">
      <div class="tour-arrow" data-tour-arrow aria-hidden="true"></div>
      <div class="tour-pop-step" data-tour-step></div>
      <h2 id="tourTitle" class="tour-pop-title" data-tour-title></h2>
      <p class="tour-pop-body" data-tour-body></p>
      <div class="tour-pop-actions">
        <button type="button" class="secondary" data-tour-skip>略過</button>
        <span class="tour-pop-nav">
          <button type="button" class="secondary" data-tour-prev>上一步</button>
          <button type="button" class="fill-submit" data-tour-next>下一步</button>
        </span>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js?v=20261029a"></script>
  <script src="js/storage.js?v=20261029a"></script>
  <script src="js/live.js?v=20261029a"></script>
  <script src="js/ui.js?v=20261029a"></script>
  <script src="js/methodology.js?v=20261029a"></script>
  <script src="js/submit.js?v=20261029a"></script>
  <script src="js/tour.js?v=20261029a"></script>
  <script src="js/app.js?v=20261029a"></script>
  <script src="js/ask.js?v=20261029a"></script>
</body>
</html>
